version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Production deps land as `fix(deps): ...` so release-please cuts a patch
    # release; dev deps land as `chore(deps): ...` and stay out of releases.
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      eslint:
        patterns:
          - eslint
          - eslint-*
          - '@eslint/*'
          - typescript-eslint
      types:
        patterns:
          - '@types/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
