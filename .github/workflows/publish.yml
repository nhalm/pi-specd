name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # release-please opens / updates a "release PR" on every push to main.
      # When that release PR is merged, this same step detects the merge and
      # outputs `release_created: true`, which gates the publish steps below.
      #
      # We pass a fine-grained PAT instead of GITHUB_TOKEN so the release PR
      # triggers `pull_request` workflows (notably `check`). PRs opened with
      # GITHUB_TOKEN are blocked from triggering workflows by GitHub.
      # continue-on-error works around release-please-action#1203: pass-2
      # (drafting the *next* release PR) can fail with a transient GraphQL
      # error after pass-1 already cut the tag and GitHub Release. Without
      # this, the step is marked failed, the gated publish steps below never
      # run, and the release is permanently stranded — re-running cannot
      # recover it because the tag now exists.
      - uses: googleapis/release-please-action@v5
        id: release
        continue-on-error: true
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: actions/checkout@v6
        if: ${{ steps.release.outputs.release_created }}

      - uses: actions/setup-node@v7
        if: ${{ steps.release.outputs.release_created }}
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'
          cache: 'npm'

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created }}
        run: npm ci

      - name: Run checks
        if: ${{ steps.release.outputs.release_created }}
        run: make check

      - name: Publish to npm
        if: ${{ steps.release.outputs.release_created }}
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
